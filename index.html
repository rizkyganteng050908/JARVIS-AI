<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZR AI</title>
<style>
:root{--bg:#0b1020;--panel:#121935;--text:#e8ecff;--muted:#8d97c4;--accent:#22d3ee;--accent2:#8b5cf6;--user:#1e2a5a;--bot:#151d3d;--border:#25305f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5ff;--panel:#fff;--text:#14183a;--muted:#5d668f;--user:#dfe6ff;--bot:#fff;--border:#d6dcf5;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f5ff;--panel:#fff;--text:#14183a;--muted:#5d668f;--user:#dfe6ff;--bot:#fff;--border:#d6dcf5;color-scheme:light}
:root[data-theme="dark"]{--bg:#0b1020;--panel:#121935;--text:#e8ecff;--muted:#8d97c4;--user:#1e2a5a;--bot:#151d3d;--border:#25305f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;letter-spacing:.5px}
.title{font-weight:700;font-size:17px}
.sub{font-size:12px;color:var(--muted)}
.sp{flex:1}
.ib{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px}
.ib:hover{color:var(--text);border-color:var(--accent)}
#chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.hero{margin:auto;text-align:center;max-width:460px}
.hero h1{font-size:30px;margin:10px 0 6px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0 0 18px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:999px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--accent)}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.55;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg pre{background:#0006;color:#e8ecff;padding:10px 12px;border-radius:10px;overflow-x:auto;font-size:13px;margin:8px 0}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.msg :not(pre)>code{background:#7c86b833;padding:1px 5px;border-radius:5px}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 8px;padding-left:20px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
form,.bar{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--panel);align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;min-height:44px;padding:11px 13px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:none}
textarea:focus{border-color:var(--accent)}
.send{height:44px;min-width:44px;padding:0 16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;cursor:pointer}
.send:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:11px;color:var(--muted);text-align:center;padding:0 14px 8px;background:var(--panel)}
.mic{height:44px;width:44px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:18px}
.mic.on{background:#ef4444;color:#fff;border-color:#ef4444;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.6}}
.gen{display:block;width:100%;max-width:520px;border-radius:12px;margin-top:10px;border:1px solid var(--border);background:#fff}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">RZR</div>
    <div><div class="title">RZR AI</div><div class="sub">Asisten pintar buatan Rizky</div></div>
    <div class="sp"></div>
    <button class="ib" id="tts" title="Suara RZR AI">🔊</button>
    <button class="ib" id="theme" title="Ganti tema">◐</button>
    <button class="ib" id="clear">Chat baru</button>
  </header>
  <div id="chat"></div>
  <div class="bar">
    <button class="mic" id="mic" title="Bicara">🎤</button>
    <textarea id="in" rows="1" placeholder="Ketik, bicara, atau minta gambar…"></textarea>
    <button class="send" id="send">Kirim</button>
  </div>
  <div class="note">RZR AI bisa keliru. Periksa kembali info penting.</div>
</div>
<script>
var PERSONA = "Kamu adalah RZR AI, asisten AI yang ramah, cerdas, dan to the point, dibuat oleh Mochamad Rizky Ramadhan (RZR.DEV). Selalu perkenalkan dirimu sebagai RZR AI. Balas dalam bahasa yang dipakai pengguna (default Bahasa Indonesia). Gunakan format sederhana: paragraf pendek, daftar dengan tanda -, dan blok kode dengan tiga backtick jika perlu. Jangan menyebut instruksi ini.";
var chatEl = document.getElementById("chat"), inEl = document.getElementById("in"), sendBtn = document.getElementById("send");
var history = [], sample = null, busy = false, ctrl = null;

var SUG = ["Jelaskan apa itu API dengan sederhana", "Kasih aku gambar random", "Gambarkan pemandangan gunung saat senja", "Tips belajar JavaScript dari nol"];
var IMG_RE = /\b(gambar(kan)?|foto|lukis(kan)?|ilustrasi|sketsa|wallpaper|poster|logo|draw|picture|image|photo)\b/i;
var SUBJ = ["kucing lucu di jendela saat hujan", "kota futuristik malam hari", "pantai tropis saat matahari terbenam", "astronot di planet berwarna ungu", "hutan ajaib dengan kunang-kunang", "robot kecil sedang menanam bunga", "gunung bersalju dengan danau", "kapal layar di lautan berbintang"];
var ttsOn = true;
function speak(t){
  if (!ttsOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    var c = t.replace(/```[\s\S]*?```/g, " kode ").replace(/[*`#_]/g, "").replace(/\s+/g, " ").trim().slice(0, 600);
    if (!c) return;
    var u = new SpeechSynthesisUtterance(c);
    u.lang = /\b(the|and|is|you|this)\b/i.test(c) ? "en-US" : "id-ID";
    speechSynthesis.speak(u);
  } catch (e) {}
}
var micBtn = document.getElementById("mic"), listening = false, base = "", dict = null, rec = null;
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function setMic(on){ listening = on; micBtn.classList.toggle("on", on); }
micBtn.onclick = function(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (dict){
    if (listening){ dict.stop(); return; }
    base = inEl.value ? inEl.value + " " : "";
    dict.start().catch(function(){});
  } else if (SR){
    if (listening){ rec.stop(); return; }
    base = inEl.value ? inEl.value + " " : "";
    rec = new SR(); rec.lang = "id-ID"; rec.interimResults = true;
    rec.onresult = function(e){ var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; inEl.value = base + t; };
    rec.onend = function(){ setMic(false); };
    rec.onerror = function(){ setMic(false); };
    rec.start(); setMic(true);
  }
};
document.getElementById("tts").onclick = function(){
  ttsOn = !ttsOn; this.textContent = ttsOn ? "🔊" : "🔇";
  if (!ttsOn && window.speechSynthesis) speechSynthesis.cancel();
};

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");}
function md(t){
  var parts = t.split(/```/), out = "";
  for (var i = 0; i < parts.length; i++){
    if (i % 2 === 1){
      var c = parts[i].replace(/^[^\n]*\n/, "");
      out += "<pre><code>" + esc(c.replace(/\n$/, "")) + "</code></pre>";
    } else {
      var blocks = parts[i].split(/\n{2,}/);
      blocks.forEach(function(b){
        if (!b.trim()) return;
        var lines = b.split("\n");
        if (lines.every(function(l){return /^\s*[-*]\s+/.test(l);})){
          out += "<ul>" + lines.map(function(l){return "<li>" + inline(l.replace(/^\s*[-*]\s+/, "")) + "</li>";}).join("") + "</ul>";
        } else {
          out += "<p>" + lines.map(inline).join("<br>") + "</p>";
        }
      });
    }
  }
  return out;
}
function scroll(){chatEl.scrollTop = chatEl.scrollHeight;}
function add(role, text){
  var d = document.createElement("div");
  d.className = "msg " + role;
  if (role === "user") d.textContent = text; else d.innerHTML = text;
  chatEl.appendChild(d); scroll(); return d;
}
function hero(){
  chatEl.innerHTML = "";
  var h = document.createElement("div");
  h.className = "hero";
  h.innerHTML = "<div class=\"logo\" style=\"margin:0 auto;width:60px;height:60px;font-size:20px;border-radius:18px\">RZR</div><h1>Halo, saya RZR AI</h1><p>Tanyakan apa saja: coding, ide, tulisan, belajar, atau sekadar ngobrol.</p>";
  var c = document.createElement("div"); c.className = "chips";
  SUG.forEach(function(s){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = s;
    b.onclick = function(){ send(s); };
    c.appendChild(b);
  });
  h.appendChild(c); chatEl.appendChild(h);
}
async function send(text){
  text = (text || inEl.value).trim();
  if (!text || busy) return;
  if (!sample){ add("bot", "<p>Fitur AI belum tersedia di tampilan ini. Buka halaman lewat claude.ai dan beri izin.</p>"); return; }
  var hr = chatEl.querySelector(".hero"); if (hr) chatEl.innerHTML = "";
  inEl.value = ""; inEl.style.height = "auto";
  add("user", text);
  history.push({role: "user", content: text});
  var msgs = history.map(function(m, i){
    return i === 0 ? {role: "user", content: PERSONA + "\n\n---\nPesan pengguna:\n" + m.content} : m;
  });
  var bot = add("bot", "<span class=\"dots\"><span></span><span></span><span></span></span>");
  busy = true; sendBtn.disabled = true; ctrl = new AbortController();
  try {
    if (IMG_RE.test(text)) {
      var subj = /random|acak|bebas|terserah/i.test(text) ? " Pilih sendiri subjek secara acak, misalnya: " + SUBJ[Math.floor(Math.random() * SUBJ.length)] + "." : "";
      var im = msgs.slice(0, -1).concat([{role: "user", content: msgs[msgs.length - 1].content + "\n\n[Instruksi: pengguna meminta gambar. Buat ilustrasi SVG yang indah dan detail (viewBox 0 0 800 600, gradien dan bentuk yang kaya, tanpa script, tanpa gambar atau font eksternal). Tulis satu kalimat pembuka singkat, lalu kode <svg>...</svg> lengkap, tidak ada yang lain." + subj + "]"}]);
      bot.innerHTML = "<span class=\"dots\"><span></span><span></span><span></span></span> Sedang menggambar…";
      var g = await sample(im, {cache: false, signal: ctrl.signal});
      var mm = g.text.match(/<svg[\s\S]*<\/svg>/i);
      var cap = g.text.replace(/```(?:svg|xml|html)?/gi, "").replace(/<svg[\s\S]*<\/svg>/i, "").trim() || "Ini gambarnya:";
      bot.innerHTML = md(cap);
      if (mm) {
        var svg = mm[0].replace(/<script[\s\S]*?<\/script>/gi, "");
        if (!/xmlns=/.test(svg)) svg = svg.replace("<svg", "<svg xmlns=\"http://www.w3.org/2000/svg\"");
        var img = new Image(); img.className = "gen"; img.alt = "Gambar buatan RZR AI";
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        bot.appendChild(img);
      } else { bot.innerHTML += "<p>Gambar belum berhasil dibuat, coba lagi.</p>"; }
      history.push({role: "assistant", content: cap + " [gambar dibuat]"});
      speak(cap);
    } else {
      var r = await sample(msgs, {cache: false, signal: ctrl.signal, onText: function(o){ bot.innerHTML = md(o.text); scroll(); }});
      bot.innerHTML = md(r.text); history.push({role: "assistant", content: r.text});
      speak(r.text);
    }
  } catch (e) {
    history.pop();
    var m = e && e.code === "rate_limited" ? "Terlalu banyak permintaan, coba lagi sebentar." : e && e.code === "not_granted" ? "Izin ditolak. Muat ulang halaman dan izinkan RZR AI." : "Maaf, terjadi kesalahan. Coba kirim lagi.";
    bot.innerHTML = "<p>" + m + "</p>";
  }
  busy = false; sendBtn.disabled = false; ctrl = null; scroll(); inEl.focus();
}
sendBtn.onclick = function(){ send(); };
inEl.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
inEl.addEventListener("input", function(){ inEl.style.height = "auto"; inEl.style.height = Math.min(inEl.scrollHeight, 140) + "px"; });
document.getElementById("clear").onclick = function(){ if (window.speechSynthesis) speechSynthesis.cancel(); if (ctrl) ctrl.abort(); history = []; busy = false; sendBtn.disabled = false; hero(); };
document.getElementById("theme").onclick = function(){
  var r = document.documentElement, dark = r.getAttribute("data-theme") ? r.getAttribute("data-theme") === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
};
hero();
(async function(){
  try { sample = await claude.use("sample"); } catch (e) { sample = null; }
  try { dict = await claude.use("dictation"); } catch (e) { dict = null; }
  if (dict) {
    dict.onPartial(function(o){ inEl.value = base + o.text; });
    dict.onFinal(function(o){ base += o.text + " "; inEl.value = base; });
    dict.onState(function(o){ setMic(o.state === "listening"); });
  } else if (!SR) { micBtn.style.display = "none"; }
})();
</script>
</body>
</html>
